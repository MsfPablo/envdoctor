name: CI
on: [push]

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test
      - name: Deploy
        run: |
          echo "deploying with ${{ secrets.DEPLOY_TOKEN }}"
          echo "node version $NODE_VERSION"
