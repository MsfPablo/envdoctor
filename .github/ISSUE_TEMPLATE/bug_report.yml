name: Bug report
description: Report a problem with envdoctor
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a link to a minimal repo.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: envdoctor version
      placeholder: e.g., 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g., 20.12.0
